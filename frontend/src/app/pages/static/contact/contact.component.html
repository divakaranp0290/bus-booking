<app-header></app-header>

<section class="static-page">



    <h1 style="
    text-align: center;
">Contact Viaa</h1>
    <!-- CONTACT FORM -->
    <div class="card shadow-sm p-4 contact-card">
        <h2 class="mb-3">Send Us a Message</h2>

        <form (ngSubmit)="sendMessage()" #contactForm="ngForm">
            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" class="form-control" [(ngModel)]="name" name="name" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" [(ngModel)]="email" name="email" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Message</label>
                <textarea class="form-control" rows="4" [(ngModel)]="message" name="message" required></textarea>
            </div>

            <button type="submit" class="btn btn-primary w-100" [disabled]="sending">
                {{ sending ? 'Sending...' : 'Submit' }}
            </button>
        </form>

        <!-- Success Alert -->
        <div *ngIf="successMsg" class="alert alert-success mt-3">
            {{ successMsg }}
        </div>

        <!-- Error Alert -->
        <div *ngIf="errorMsg" class="alert alert-danger mt-3">
            {{ errorMsg }}
        </div>
    </div>

    <!-- CONTACT INFO BAR -->
    <div class="card shadow-sm mb-4 contact-info-bar">
        <div class="contact-info-grid">

            <div class="contact-info-item">
                <div class="contact-icon">
                    <i class="bi bi-envelope"></i>
                </div>
                <div class="contact-text">
                    <span class="label">Email</span>
                    <span class="value">support&#64;viaa.com</span>
                </div>
            </div>

            <div class="contact-info-item">
                <div class="contact-icon">
                    <i class="bi bi-telephone"></i>
                </div>
                <div class="contact-text">
                    <span class="label">Phone</span>
                    <span class="value">+91-9791040228</span>
                </div>
            </div>

            <div class="contact-info-item">
                <div class="contact-icon">
                    <i class="bi bi-whatsapp"></i>
                </div>
                <div class="contact-text">
                    <span class="label">WhatsApp</span>
                    <span class="value">+91-9791040228</span>
                </div>
            </div>

        </div>
    </div>

</section>

<app-footer></app-footer>
